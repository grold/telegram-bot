[project]
name = "telegram-bot"
version = "0.7.6"
description = "telegram bot experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.25.0",
    "geopy>=2.4.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "timezonefinder>=7.0.0,<8.0.0",
    "optimum[openvino]>=1.26.0",
    "transformers>=4.48.0",
    "accelerate>=1.3.0",
    "numpy>=1.26.0,<2.0.0",
    "ffmpeg-python>=0.2.0",
    "onvif-zeep>=0.2.12",
    "httpx>=0.27.0",
    "Pillow>=10.2.0",
    "torch",
    "torchaudio",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
